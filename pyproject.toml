[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thilos"
version = "0.1.5"
authors = [
    {name = "Fabricio M. Pérez-Toledo", email = "fabricio.perez@gtc.iac.es"},
]
description = "This software is designed to reduce Deep Field Imaging observations obtained with HIPERCAM."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dependencies = [
    "astroalign",
    "astrometry-net-client",
    "astropy",
    "astroquery",
    "ccdproc",
    "lacosmic",
    "loguru",
    "matplotlib",
    "numpy",
    "PyYAML",
    "sep",
    "pandas",
    "opencv-python",
    "photutils"
]

[project.urls]
Homepage = "https://github.com/Kennicutt/THILOS"
"Bug Tracker" = "https://github.com/Kennicutt/THILOS/issues"

# ========== CONSOLE SCRIPT ==========
[project.scripts]
thilos = "thilos.DRP:run"

# ========== PACKAGE DATA ==========
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
thilos = [
    "config/configuration.json",
    "BPM/*.fits"
]

# ========== FIND PACKAGES ==========
[tool.setuptools.packages.find]
where = ["."]   # same as packages=find_packages(where='.')
include = ["thilos*"]
